[project]
name = "oct-static-software"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JoaquinTerzano", email = "joaquin.l.terzano@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "numpy>=2.5.3",
    "pyqtgraph>=0.14.0",
    "pyserial>=3.5",
    "pyside6>=6.11.2",
    "scipy>=1.18.1",
]

[project.scripts]
oct-static-software = "oct_static_software:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
]
